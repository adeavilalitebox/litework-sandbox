name: Secrets

# gitleaks over the full history on every PR and push. A real secret it flags is ROTATED FIRST,
# then removed or added to .gitleaksignore by fingerprint. Never just ignore it.
# (From hellolitebox/litebox-inbox-jev: gitleaks-action needs a paid license for org repos, the
# CLI image is free.)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v
